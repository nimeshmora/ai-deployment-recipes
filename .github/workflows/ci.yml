name: Recipe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: recipes/01-ai-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/init_local.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python scripts/smoke.py
      - name: Check non-root and read-only filesystem
        run: |
          docker compose exec -T app python -c 'import os; assert os.getuid() == 10001'
          docker compose exec -T app python -c 'import os; assert os.statvfs("/app").f_flag & os.ST_RDONLY'
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down
